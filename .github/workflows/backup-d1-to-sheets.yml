name: D1 Backup and Google Sheets Sync

on:
  schedule:
    # Berjalan tiap hari jam 20:00 UTC (= 03:00 WIB)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      sync_sheets:
        description: 'Sinkronisasi ke Google Sheets?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: backup-d1-sheets
  cancel-in-progress: true

jobs:
  backup-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Jalankan D1 Backup & Sheets Dispatch Script
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || '0f8a9e42-0a14-4a45-9cbb-55f7d8b2f5f1' }}
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
          GOOGLE_SHEETS_WEBHOOK_SECRET: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_SECRET }}
          SYNC_SHEETS: ${{ github.event.inputs.sync_sheets || 'true' }}
        run: node scripts/backup-d1-to-sheets.mjs

      - name: Prune snapshot lokal yang lebih dari 30 hari
        run: |
          find backups/d1/ -name "*.json" -type f -mtime +30 -delete 2>/dev/null || true

      # A snapshot whose every table is empty means the token/DB id is wrong, not
      # that the church has no data. Committing it would put a fake "backup" in
      # permanent git history and hide the outage, so this step fails the job —
      # and because the commit step below never runs, history stays clean.
      #
      # The total is not enough on its own. A token scoped to one table, or a
      # query that fails on one table while others succeed, still sums well above
      # zero while the snapshot is quietly missing data. `users` is the one that
      # matters — it is what a restore needs before anyone can log in — so the
      # check below asserts it directly rather than trusting the sum.
      - name: Verify snapshot is not empty
        run: |
          LATEST=$(ls -t backups/d1/*.json 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then
            echo "::error::Tidak ada file snapshot yang dihasilkan."
            exit 1
          fi
          node -e "
            const s = require('./$LATEST');
            const t = s.tables || {};
            const total = Object.values(t).reduce((a, v) => a + (Array.isArray(v) ? v.length : 0), 0);
            console.log('Snapshot $LATEST berisi ' + total + ' baris.');
            if (total === 0) {
              console.error('::error::Snapshot kosong. Kemungkinan CLOUDFLARE_API_TOKEN atau CLOUDFLARE_ACCOUNT_ID salah/tidak diset.');
              process.exit(1);
            }
            // Tables that are never empty in a healthy production DB. If one of
            // these comes back empty, the query failed or the token lost scope —
            // and a snapshot without users is not a restorable backup.
            const required = ['users', 'announcements'];
            const missing = required.filter((k) => !Array.isArray(t[k]) || t[k].length === 0);
            if (missing.length) {
              console.error('::error::Tabel kritis kosong: ' + missing.join(', ') + '. Snapshot cacat, tidak di-commit.');
              process.exit(1);
            }
            console.log('  users=' + (t.users||[]).length + ' announcements=' + (t.announcements||[]).length + ' (tabel kritis terisi)');
          "

      - name: Commit & push local D1 snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/d1/
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan snapshot untuk di-commit."
          else
            git commit -m "chore(backup): d1 snapshot $(date -u +%Y-%m-%d_%H%M%S) [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi
