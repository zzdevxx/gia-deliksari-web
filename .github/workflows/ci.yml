name: CI — TypeScript + Playwright smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backups/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'backups/**'
      - '**.md'
  schedule:
    # 03:17 UTC daily. DESIGN.md's frontmatter is the allow-list that
    # `lint:design` checks against, but `paths-ignore` has no negation and
    # `**.md` swallows every .md — so a palette-only edit can't trigger this
    # workflow. The daily run catches it. Any src/ change needing a new
    # colour also edits DESIGN.md, and the src/ push triggers it directly.
    - cron: '17 3 * * *'
  workflow_dispatch:

# Don't run multiple in parallel; cancel in-progress on new push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript compile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit --skipLibCheck

  unit:
    name: Vitest component tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  design-system:
    name: Design-system gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs on every src/ edit, and again daily via the schedule above to
    # catch a DESIGN.md-only change that paths-ignore can't trigger.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Checks every colour, font size and radius in src/ against the
      # allow-list in DESIGN.md's YAML frontmatter. The detector reads the
      # frontmatter only — prose in that file is documentation, not config.
      - name: Verify palette, type ramp and radius scale
        run: npm run lint:design

  smoke:
    name: Playwright smoke (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against production
        # Don't enable mutation tests in CI by default — those mutate
        # production DB. Enable via commit message suffix '[mutations]'.
        # Credentials come from repo secrets, never from the test files.
        run: npx playwright test tests/e2e/smoke.spec.ts --project=chromium
        env:
          TEST_SUPER_USER: ${{ secrets.TEST_SUPER_USER }}
          TEST_SUPER_PASS: ${{ secrets.TEST_SUPER_PASS }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  mutations:
    name: Playwright mutations (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mutations]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run mutation suite
        env:
          RUN_MUTATION_TESTS: '1'
          BASE_URL: https://giadeliksari.my.id
          TEST_SUPER_USER: ${{ secrets.TEST_SUPER_USER }}
          TEST_SUPER_PASS: ${{ secrets.TEST_SUPER_PASS }}
        run: npx playwright test tests/e2e/mutations.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mutations-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7