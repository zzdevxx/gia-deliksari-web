name: Lighthouse CI

# Runs Lighthouse against the production deployment on every push to main.
# Asserts Performance >= 0.9, Accessibility >= 0.95, Best Practices >= 0.95, SEO >= 0.9.
# Posts results as GitHub Status checks via LHCI_GITHUB_APP_TOKEN (optional).
#
# To enable permanent LHCI dashboard storage, add LHCI_TOKEN secret.
# Without it, reports upload to temporary-public-storage and live 7 days.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lhci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          npx --yes @lhci/cli@0.14.x autorun

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 14